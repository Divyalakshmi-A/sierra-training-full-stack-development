_schema-version: 3.3.0
ID: Full_Stack
version: 1.0.0
description: Library Management System (CAP + React)
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - rm -rf node_modules .Full_Stack_mta_build_tmp mta_archives
modules:
  - name: Full_Stack-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: Full_Stack-auth
      - name: Full_Stack-db

  - name: Full_Stack-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Full_Stack-db

  - name: Full_Stack-app
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      memory: 128M
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev
        - npm ci --prefix ../library-ui
        - npm run build --prefix ../library-ui
        - rm -rf ../library-ui/node_modules
        - node -e "const fs=require('fs');const p='resources';fs.rmSync(p,{recursive:true,force:true});fs.mkdirSync(p,{recursive:true});fs.cpSync('../library-ui/dist',p,{recursive:true});"
        - npm prune --omit=dev
      ignore:
        - "../library-ui/**"
    requires:
      - name: Full_Stack-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true

resources:
  - name: Full_Stack-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Full_Stack-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*.cfapps.*.hana.ondemand.com/**
            - https://*.applicationcloud.hana.ondemand.com/**

  - name: Full_Stack-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
