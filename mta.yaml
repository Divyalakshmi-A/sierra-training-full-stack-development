_schema-version: 3.3.0
ID: Full_Stack
version: 1.0.0
description: Library Management System (CAP + React)
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - node scripts/prepare-mta.js
modules:
  - name: Full_Stack-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 1024M
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: Full_Stack-auth
      - name: Full_Stack-db

  - name: Full_Stack-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      ignore:
        - node_modules/
    requires:
      - name: Full_Stack-db

  # Approuter hosts the Vite UI from localDir "resources" (filled by scripts/prepare-mta.js).
  - name: Full_Stack-app
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      memory: 256M
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
        - "*.md"
    requires:
      - name: Full_Stack-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: false

resources:
  - name: Full_Stack-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Full_Stack-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*.cfapps.*.hana.ondemand.com/**
            - https://*.applicationcloud.hana.ondemand.com/**

  - name: Full_Stack-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
